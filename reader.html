<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#111111">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Online book reader | The Sun Book</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="assets/sun-icon.png">
    <link rel="apple-touch-icon" href="assets/icon-192.png">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/reader.css">
</head>
<body class="reader-page">
    <main class="reader-shell" id="readerShell">
        <header class="reader-toolbar">
            <a class="reader-back" href="profile.html?tab=digital" data-i18n="reader.close">Back to my library</a>
            <h1 id="readerTitle" data-i18n="reader.title">Online book reader</h1>
            <div class="reader-controls">
                <button type="button" id="zoomOut" aria-label="Zoom out" data-i18n-aria-label="reader.zoomOut">−</button>
                <button type="button" id="zoomIn" aria-label="Zoom in" data-i18n-aria-label="reader.zoomIn">+</button>
                <button type="button" id="viewBtn" class="reader-text-btn" aria-haspopup="true" aria-expanded="false"></button>
                <button type="button" id="fullscreenBtn" class="reader-text-btn" aria-label="Fullscreen">⛶</button>
            </div>
            <div id="viewMenu" class="reader-menu" hidden></div>
        </header>
        <nav id="readerTabs" class="reader-tabs" role="tablist" aria-label="Books in this bundle" data-i18n-aria-label="reader.tabsLabel" hidden></nav>
        <section class="reader-navigation" aria-label="Reader navigation">
            <button type="button" id="previousPage" data-i18n="reader.previous">Previous page</button>
            <div class="reader-page-jump">
                <span id="pageCounter" class="reader-counter"></span>
                <input id="pageNumber" type="number" min="1" step="1" inputmode="numeric" aria-label="Go to page" data-i18n-aria-label="reader.jump">
                <button type="button" id="goToPage" data-i18n="reader.jump">Go to page</button>
            </div>
            <button type="button" id="nextPage" data-i18n="reader.next">Next page</button>
            <div id="cacheChip" class="reader-chip" hidden></div>
        </section>
        <p id="readerStatus" class="reader-status" role="status" aria-live="polite"></p>
        <div id="readerViewport" class="reader-viewport">
            <div id="readerStage" class="reader-stage"></div>
        </div>
        <button type="button" id="immersiveExit" class="reader-immersive-exit" hidden></button>
    </main>
    <script src="js/i18n.js"></script>
    <script src="js/api.js"></script>
    <script src="js/reader.js"></script>
    <script src="js/pwa.js"></script>
</body>
</html>
