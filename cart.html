<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart - The Sun Book</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" type="image/png" href="assets/sun-icon.png">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#111111">
    <link rel="apple-touch-icon" href="assets/icon-192.png">
</head>
<body>
<div data-include="components/header.html"></div>

<!-- قسم سلة المشتريات -->
<section class="cart-section reveal">
    <div class="container">
        <!-- شيلنا الـ H1 من هنا عشان نسنتره تحت -->

        <div class="cart-layout">
            
            <!-- الجزء الشمال: العنوان وقائمة المنتجات -->
            <div class="cart-items-wrapper">
                <h1 class="cart-page-title" data-i18n="cart.yourCart">Your Cart</h1>
                <div class="cart-items-container" id="cart-container">
                    <!-- الجافا سكريبت هيرسم المنتجات هنا تلقائي -->
                </div>
            </div> <!-- قفلة الحاوية بتاعة الجزء الشمال بس -->

            <!-- الجزء اليمين: ملخص الحساب -->
            <div class="cart-summary">
                <h3 class="summary-title" data-i18n="cart.orderSummary">Order Summary</h3>
                
                <div class="summary-row">
                    <span data-i18n="cart.subtotal">Subtotal</span>
                    <span>EGP 114.98</span>
                </div>

                <!-- البرومو كود -->
                <div class="promo-code-container">
                    <input type="text" placeholder="Enter code (e.g. SUN7)" class="promo-input" data-i18n-placeholder="cart.promoPlaceholderExample">
                    <button class="apply-btn" data-i18n="cart.apply">Apply</button>
                </div>

                <hr class="summary-divider">
                
                <div class="summary-row total-row">
                    <span data-i18n="cart.total">Total</span>
                    <span>EGP 114.98</span>
                </div>
                
                <button class="btn-shop checkout-btn" data-i18n="cart.proceedCheckout">Proceed to Checkout</button>
            </div>
            
        </div> <!-- قفلة حاوية cart-layout اللي ضامة الشمال واليمين مع بعض -->

    </div>
</section>

<!-- الخط الفاصل قبل الفوتر -->
<div class="elegant-section-divider reveal">
    <div class="divider-line-left"></div>
    <div class="divider-center-icon">
        <span class="hollow-dot"></span>
        <div class="sun-emblem"><img src="assets/sun-icon.png" alt="Sun icon" /></div>
        <span class="hollow-dot"></span>
    </div>
    <div class="divider-line-right"></div>
</div>

<div data-include="components/footer.html"></div>
<script src="components/loader.js"></script>
<script src="js/i18n.js"></script>
<script src="js/api.js"></script>
<script src="js/script.js"></script>
<script src="js/reminder.js"></script>
    <script src="js/pwa.js"></script>
</body>
</html>
