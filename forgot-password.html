<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - The Sun Book</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" type="image/png" href="assets/sun-icon.png">
</head>
<body>
<div data-include="components/header.html"></div>

<!-- قسم استعادة كلمة السر -->
<section class="auth-section reveal">
    <div class="auth-card">
        <h2 style="color: var(--gold-color); font-family: var(--font-logo); font-size: 1.5rem; text-align: center; margin-bottom: 8px;">Forgot Password?</h2>
        <p style="color: var(--text-gray); text-align: center; font-size: 0.9rem; margin-bottom: 24px;">
            Enter your email and we'll send you a link to reset your password.
        </p>

        <form id="forgotForm" class="auth-form active">
            <input type="email" id="forgotEmail" class="auth-input" placeholder="Email Address" required>
            <button type="submit" class="btn-shop auth-submit-btn" id="forgotSubmitBtn">Send Reset Link</button>
        </form>

        <p id="forgotMsg" style="text-align: center; font-size: 0.9rem; margin-top: 16px; min-height: 20px;"></p>

        <div class="auth-action-row" style="justify-content: center; margin-top: 10px;">
            <a href="login.html" class="inline-link-clean" style="color: var(--gold-color); font-size: 0.85rem;">← Back to Sign In</a>
        </div>
    </div>
</section>

<!-- الخط الفاصل قبل الفوتر -->
<div class="elegant-section-divider reveal">
    <div class="divider-line-left"></div>
    <div class="divider-center-icon">
        <span class="hollow-dot"></span>
        <div class="sun-emblem"><img src="assets/sun-icon.png" alt="Sun icon" /></div>
        <span class="hollow-dot"></span>
    </div>
    <div class="divider-line-right"></div>
</div>

<div data-include="components/footer.html"></div>

<script src="components/loader.js"></script>
<script src="js/script.js"></script>
<script src="js/api.js"></script>
<script>
document.getElementById('forgotForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = document.getElementById('forgotEmail').value.trim();
    const msgEl = document.getElementById('forgotMsg');
    const btn = document.getElementById('forgotSubmitBtn');

    msgEl.style.color = '';
    msgEl.innerText = '';
    btn.disabled = true;
    btn.innerText = 'Sending...';

    try {
        const res = await api.forgotPassword(email);
        msgEl.style.color = '#34A853';
        msgEl.innerText = res.message || 'If an account with that email exists, a reset link has been sent.';
        document.getElementById('forgotForm').reset();
    } catch (err) {
        msgEl.style.color = '#e05252';
        msgEl.innerText = err.message || 'Something went wrong. Please try again.';
    } finally {
        btn.disabled = false;
        btn.innerText = 'Send Reset Link';
    }
});
</script>

</body>
</html>
