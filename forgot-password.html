<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - The Sun Book</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" type="image/png" href="assets/sun-icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
<div data-include="components/header.html"></div>

<!-- قسم استعادة كلمة السر -->
<section class="auth-section reveal">
    <div class="auth-card">
        <h2 style="color: var(--gold-color); font-family: var(--font-logo); font-size: 1.5rem; text-align: center; margin-bottom: 8px;" data-i18n="forgotPw.title">Forgot Password?</h2>
        <p style="color: var(--text-gray); text-align: center; font-size: 0.9rem; margin-bottom: 24px;" data-i18n="forgotPw.subtitle">
            Enter your email and we'll send you a link to reset your password.
        </p>

        <form id="forgotForm" class="auth-form active">
            <input type="email" id="forgotEmail" class="auth-input" placeholder="Email Address" required data-i18n-placeholder="auth.emailAddress">
            <button type="submit" class="btn-shop auth-submit-btn" id="forgotSubmitBtn">Send Reset Link</button>
        </form>

        <p id="forgotMsg" style="text-align: center; font-size: 0.9rem; margin-top: 16px; min-height: 20px;"></p>

        <div class="auth-action-row" style="justify-content: center; margin-top: 10px;">
            <a href="login.html" class="inline-link-clean" style="color: var(--gold-color); font-size: 0.85rem;" data-i18n="forgotPw.backToSignIn">← Back to Sign In</a>
        </div>
    </div>
</section>

<!-- الخط الفاصل قبل الفوتر -->
<div class="elegant-section-divider reveal">
    <div class="divider-line-left"></div>
    <div class="divider-center-icon">
        <span class="hollow-dot"></span>
        <div class="sun-emblem"><img src="assets/sun-icon.png" alt="Sun icon" /></div>
        <span class="hollow-dot"></span>
    </div>
    <div class="divider-line-right"></div>
</div>

<div data-include="components/footer.html"></div>

<script src="components/loader.js"></script>
<script src="js/i18n.js"></script>
<script src="js/script.js"></script>
<script src="js/api.js"></script>
<script>
document.getElementById('forgotForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = document.getElementById('forgotEmail').value.trim();
    const msgEl = document.getElementById('forgotMsg');
    const btn = document.getElementById('forgotSubmitBtn');
    const tr = (key, fallback) => (window.SunBookI18n ? window.SunBookI18n.t(key) : fallback);

    msgEl.style.color = '';
    msgEl.innerText = '';
    btn.disabled = true;
    btn.innerText = tr('forgotPw.sending', 'Sending...');

    try {
        const res = await api.forgotPassword(email);
        msgEl.style.color = '#34A853';
        msgEl.innerText = res.message || tr('forgotPw.linkSentIfExists', 'If an account with that email exists, a reset link has been sent.');
        document.getElementById('forgotForm').reset();
    } catch (err) {
        msgEl.style.color = '#e05252';
        msgEl.innerText = err.message || tr('forgotPw.somethingWentWrong', 'Something went wrong. Please try again.');
    } finally {
        btn.disabled = false;
        btn.innerText = tr('forgotPw.sendResetLink', 'Send Reset Link');
    }
});

// النص الافتراضي للزرار بيتحط هنا يدويًا (مش عن طريق data-i18n) لنفس سبب
// عنوان صفحة المنتج - الزرار بيتغيّر نصه مؤقتًا أثناء الإرسال، ولو سبنا
// data-i18n عليه، أي تحديث تاني في الصفحة كان هيرجّعه لحالته الافتراضية
// في نص العملية
function syncForgotSubmitBtnText() {
    const btn = document.getElementById('forgotSubmitBtn');
    if (btn && !btn.disabled) btn.innerText = window.SunBookI18n ? window.SunBookI18n.t('forgotPw.sendResetLink') : 'Send Reset Link';
}
syncForgotSubmitBtnText();
document.addEventListener('sunbook:langChanged', syncForgotSubmitBtnText);
</script>

</body>
</html>
