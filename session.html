<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Session - The Sun Book</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" type="image/png" href="assets/sun-icon.png">
  <style>
    body { margin: 0; background: #030406; overflow: hidden; }
    #jitsi-container { width: 100vw; height: calc(100vh - 52px); margin-top: 52px; }
    .session-header {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      background: rgba(3,4,6,0.9); border-bottom: 1px solid rgba(216,176,86,0.2);
      padding: 12px 20px; display: flex; justify-content: space-between; align-items: center;
    }
    .session-header h3 { color: var(--gold-color); margin: 0; font-family: var(--font-logo); }
    .session-header .btn-end {
      background: #ff4d4d; color: #fff; border: none; padding: 8px 20px;
      border-radius: 6px; cursor: pointer; font-weight: bold;
    }
  </style>
</head>
<body>

<div class="session-header">
  <h3 id="sessionTitle">Live Session</h3>
  <button class="btn-end" onclick="endCall()">End Call</button>
</div>

<div id="waitingScreen" style="display:none; height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding: 20px; color:#e8e8e8; font-family: Georgia, serif;">
  <div style="font-size: 2.5rem; margin-bottom: 12px;">🌞</div>
  <h2 id="waitingTitle" style="color: var(--gold-color); margin-bottom: 10px;"></h2>
  <p id="waitingMessage" style="color:#aaa; max-width: 420px; line-height: 1.6;"></p>
  <p id="waitingCountdown" style="color: var(--gold-color); font-size: 1.3rem; margin-top: 20px; font-weight: bold;"></p>
  <a id="backLink" href="profile.html" style="margin-top: 24px; color: var(--gold-color); text-decoration: underline;">Back to Profile</a>
</div>

<div id="jitsi-container" style="display:none;"></div>

<script src="https://meet.jit.si/external_api.js"></script>
<script src="js/api.js"></script>

<script>
const urlParams = new URLSearchParams(window.location.search);
const sessionId = urlParams.get('id');
// لو دخلنا الجلسة من لوحة الأدمن (أو من إيميل الأدمن)، أي "رجوع" لازم يودّينا للوحة الأدمن تاني، مش لبروفايل مستخدم عادي
const cameFromAdmin = urlParams.get('from') === 'admin';
const backDestination = cameFromAdmin ? 'admin.html' : 'profile.html';
document.getElementById('backLink').href = backDestination;
let jitsiApi = null;

let countdownInterval = null;

function showWaitingScreen(title, message) {
  document.getElementById('jitsi-container').style.display = 'none';
  document.getElementById('waitingScreen').style.display = 'flex';
  document.getElementById('waitingTitle').innerText = title;
  document.getElementById('waitingMessage').innerText = message;
}

// بيعرض عدّاد تنازلي لحد ما وقت الدخول يفتح، وبعدين يعمل reload تلقائي عشان يبدأ الاجتماع فورًا
function startCountdown(targetDate) {
  const countdownEl = document.getElementById('waitingCountdown');
  if (countdownInterval) clearInterval(countdownInterval);

  countdownInterval = setInterval(() => {
    const diff = targetDate.getTime() - Date.now();
    if (diff <= 0) {
      clearInterval(countdownInterval);
      window.location.reload();
      return;
    }
    const mins = Math.floor(diff / 60000);
    const secs = Math.floor((diff % 60000) / 1000);
    countdownEl.innerText = `Starts in ${mins}m ${secs.toString().padStart(2, '0')}s`;
  }, 1000);
}

async function initMeeting() {
  const token = localStorage.getItem('sunbook_token');
  if (!token || token === 'social_dummy_token' || !sessionId) {
    alert('Please sign in first');
    window.location.href = 'login.html';
    return;
  }

  try {
    const { data } = await api.getSession(sessionId);
    const session = data.session || data;
    const cfg = data.meetingConfig;
    const joinWindow = data.joinWindow;
    const userName = localStorage.getItem('sunbook_username') || 'Sunbook User';

    document.getElementById('sessionTitle').innerText = session.subject || 'Live Session';

    // --- الجلسة فاتت ومحدش دخل ---
    if (joinWindow && joinWindow.isMissed) {
      showWaitingScreen(
        'Session Missed',
        "This session's time has passed and nobody joined. Please contact support to reschedule, or book a new session from your profile."
      );
      return;
    }

    // --- لسه بدري، الدخول هيفتح لاحقًا ---
    if (joinWindow && joinWindow.isTooEarly) {
      const opensAt = new Date(joinWindow.joinOpensAt);
      showWaitingScreen(
        'Not Started Yet',
        'You can join this session starting 10 minutes before its scheduled time.'
      );
      startCountdown(opensAt);
      return;
    }

    document.getElementById('waitingScreen').style.display = 'none';
    document.getElementById('jitsi-container').style.display = 'block';

    const domain = cfg?.domain || 'meet.jit.si';
    const roomName = cfg?.roomName || session.jitsiRoomName;

    const options = {
      roomName,
      parentNode: document.getElementById('jitsi-container'),
      width: '100%',
      height: '100%',
      configOverwrite: cfg?.configOverwrite || {
        startAudioOnly: true,
        startWithAudioMuted: false,
        startWithVideoMuted: true,
        prejoinPageEnabled: false,
      },
      interfaceConfigOverwrite: cfg?.interfaceConfigOverwrite || {
        SHOW_JITSI_WATERMARK: false,
        SHOW_WATERMARK_FOR_GUESTS: false,
      },
      userInfo: cfg?.userInfo || { displayName: userName },
      lang: 'en',
    };

    if (cfg?.jwt) options.jwt = cfg.jwt;

    jitsiApi = new JitsiMeetExternalAPI(domain, options);

    jitsiApi.addEventListener('videoConferenceJoined', () => {
      api.joinSession(sessionId).catch(() => {});
    });

    jitsiApi.addEventListener('readyToClose', endCall);
  } catch (err) {
    alert('Error: ' + err.message);
    window.location.href = backDestination;
  }
}

async function endCall() {
  if (jitsiApi) {
    jitsiApi.dispose();
    jitsiApi = null;
  }
  try {
    await api.endSession(sessionId);
  } catch (e) {}
  window.location.href = backDestination;
}

initMeeting();
</script>

</body>
</html>
