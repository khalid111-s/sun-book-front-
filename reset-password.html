<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - The Sun Book</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" type="image/png" href="assets/sun-icon.png">
</head>
<body>
<div data-include="components/header.html"></div>

<!-- قسم إعادة تعيين كلمة السر -->
<section class="auth-section reveal">
    <div class="auth-card">
        <h2 style="color: var(--gold-color); font-family: var(--font-logo); font-size: 1.5rem; text-align: center; margin-bottom: 8px;">Set a New Password</h2>
        <p style="color: var(--text-gray); text-align: center; font-size: 0.9rem; margin-bottom: 24px;">
            Choose a new password for your account.
        </p>

        <form id="resetForm" class="auth-form active">
            <input type="password" id="newPassword" class="auth-input" placeholder="New Password" minlength="6" required>
            <input type="password" id="confirmPassword" class="auth-input" placeholder="Confirm New Password" minlength="6" required>
            <button type="submit" class="btn-shop auth-submit-btn" id="resetSubmitBtn">Reset Password</button>
        </form>

        <p id="resetMsg" style="text-align: center; font-size: 0.9rem; margin-top: 16px; min-height: 20px;"></p>

        <div class="auth-action-row" style="justify-content: center; margin-top: 10px;">
            <a href="login.html" class="inline-link-clean" style="color: var(--gold-color); font-size: 0.85rem;">← Back to Sign In</a>
        </div>
    </div>
</section>

<!-- الخط الفاصل قبل الفوتر -->
<div class="elegant-section-divider reveal">
    <div class="divider-line-left"></div>
    <div class="divider-center-icon">
        <span class="hollow-dot"></span>
        <div class="sun-emblem"><img src="assets/sun-icon.png" alt="Sun icon" /></div>
        <span class="hollow-dot"></span>
    </div>
    <div class="divider-line-right"></div>
</div>

<div data-include="components/footer.html"></div>

<script src="components/loader.js"></script>
<script src="js/script.js"></script>
<script src="js/api.js"></script>
<script>
const resetToken = new URLSearchParams(window.location.search).get('token');
const resetForm = document.getElementById('resetForm');
const resetMsg = document.getElementById('resetMsg');

if (!resetToken) {
    resetForm.style.display = 'none';
    resetMsg.style.color = '#e05252';
    resetMsg.innerText = 'This reset link is invalid. Please request a new one from the sign-in page.';
}

resetForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const password = document.getElementById('newPassword').value;
    const confirm = document.getElementById('confirmPassword').value;
    const btn = document.getElementById('resetSubmitBtn');

    resetMsg.style.color = '';
    resetMsg.innerText = '';

    if (password.length < 6) {
        resetMsg.style.color = '#e05252';
        resetMsg.innerText = 'Password must be at least 6 characters.';
        return;
    }
    if (password !== confirm) {
        resetMsg.style.color = '#e05252';
        resetMsg.innerText = 'Passwords do not match.';
        return;
    }

    btn.disabled = true;
    btn.innerText = 'Resetting...';

    try {
        const res = await api.resetPassword(resetToken, password);
        // نسجّل دخوله تلقائي بعد نجاح إعادة التعيين
        localStorage.setItem('sunbook_token', res.data.token);
        localStorage.setItem('sunbook_username', res.data.name);
        localStorage.setItem('sunbook_user_id', res.data._id);

        resetMsg.style.color = '#34A853';
        resetMsg.innerText = 'Password updated! Redirecting...';
        setTimeout(() => { window.location.href = 'index.html'; }, 1500);
    } catch (err) {
        resetMsg.style.color = '#e05252';
        resetMsg.innerText = err.message || 'This link is invalid or has expired.';
        btn.disabled = false;
        btn.innerText = 'Reset Password';
    }
});
</script>

</body>
</html>
